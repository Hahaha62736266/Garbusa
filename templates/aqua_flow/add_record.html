<style>
/* ---------- Aqua Flow Form Styles ---------- */
.field-error    { color: #dc2626; font-size: 0.85em; margin-top: 4px; display: block; }
.message-area   { margin: 1rem 0; padding: 0.75rem 1rem; border-radius: 6px; display: none; }
.message-area.success { background: #ecfdf5; color: #065f46; display: block; }
.message-area.error   { background: #fef2f2; color: #991b1b; display: block; }
button:disabled { opacity: 0.6; cursor: not-allowed; }
.spinner        { display: inline-block; width: 14px; height: 14px; border: 2px solid #ddd; border-top-color: #0891b2; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
.form-group     { margin-bottom: 1rem; }
label           { display: block; margin-bottom: 0.3rem; font-weight: 500; }
input, select, textarea { width: 100%; padding: 0.6rem; border: 1px solid #cbd5e1; border-radius: 6px; }
</style>

<!-- ============== AQUA FLOW RECORD FORM ============== -->
<form id="aquaFlowForm">
  <div class="form-group">
    <label>Device ID</label>
    <input type="text" name="device_id" id="field_device_id" placeholder="e.g. AQF-001">
    <span class="field-error" id="err_device_id"></span>
  </div>

  <div class="form-group">
    <label>Flow Rate (L/s)</label>
    <input type="number" step="0.01" name="flow_rate" id="field_flow_rate" placeholder="e.g. 12.50">
    <span class="field-error" id="err_flow_rate"></span>
  </div>

  <div class="form-group">
    <label>Water Level (m)</label>
    <input type="number" step="0.01" name="water_level" id="field_water_level" placeholder="e.g. 4.20">
    <span class="field-error" id="err_water_level"></span>
  </div>

  <div class="form-group">
    <label>Status</label>
    <select name="status" id="field_status">
      <option value="">-- Select Status --</option>
      <option value="normal">Normal</option>
      <option value="low_flow">Low Flow</option>
      <option value="high_flow">High Flow</option>
      <option value="alert">Alert</option>
    </select>
    <span class="field-error" id="err_status"></span>
  </div>

  <div class="form-group">
    <label>Notes / Observations</label>
    <textarea name="notes" id="field_notes" rows="3" placeholder="Optional details..."></textarea>
    <span class="field-error" id="err_notes"></span>
  </div>

  <button type="submit" id="submitBtn">
    <span class="btn-text">Save Record</span>
    <span class="btn-spinner" style="display:none;">
      <span class="spinner"></span> Saving...
    </span>
  </button>

  <div id="globalMessage" class="message-area"></div>
</form>

<!-- ============== ASYNC SUBMIT HANDLER ============== -->
<script>
const form          = document.getElementById('aquaFlowForm');
const submitBtn     = document.getElementById('submitBtn');
const btnText       = submitBtn.querySelector('.btn-text');
const btnSpinner    = submitBtn.querySelector('.btn-spinner');
const globalMessage = document.getElementById('globalMessage');

// --- Clear All Errors ---
function clearAllErrors() {
  document.querySelectorAll('.field-error').forEach(el => el.textContent = '');
  globalMessage.style.display = 'none';
  globalMessage.className = 'message-area';
}

// --- Loading State ---
function setLoading(isLoading) {
  submitBtn.disabled = isLoading;
  btnText.style.display = isLoading ? 'none' : 'inline';
  btnSpinner.style.display = isLoading ? 'inline-flex' : 'none';
}

// --- Success / Error Displays ---
function showSuccess(msg) {
  globalMessage.textContent = msg;
  globalMessage.className = 'message-area success';
}

function showFieldErrors(errors) {
  for (const [field, messages] of Object.entries(errors)) {
    const el = document.getElementById(`err_${field}`);
    if (el) el.textContent = messages.join(' ');
  }
}

function showGlobalError(msg) {
  globalMessage.textContent = msg;
  globalMessage.className = 'message-area error';
}

// --- Submit Logic ---
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearAllErrors();
  setLoading(true);

  try {
    const formData = new FormData(form);
    const payload = Object.fromEntries(formData);

    const res = await fetch('/api/aqua-flow', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    const result = await res.json();

    // 🔴 422 — Validation Errors
    if (res.status === 422 && result.errors) {
      showFieldErrors(result.errors);
      if (result.message) showGlobalError(result.message);
      return;
    }

    // 🔴 Other HTTP Errors
    if (!res.ok) throw new Error(result.message || `Request failed (${res.status})`);

    // ✅ SUCCESS PATH
    if (result.success) {
      showSuccess(result.message);
      form.reset(); // Clear form after save
      // Optional: refresh dashboard / close modal / redirect
      // if (window.loadLatestRecords) loadLatestRecords();
      return;
    }

    // 🔴 Business Logic Failure
    showGlobalError(result.message || 'Could not save record.');

  } catch (err) {
    // 🔴 Network / Parse / 500 — Never crash UI
    console.error('Submit error:', err);
    showGlobalError(
      !navigator.onLine || err.message.includes('fetch')
        ? 'Network disconnected. Check your connection and try again.'
        : err.message || 'Unexpected error. Please refresh and retry.'
    );
  } finally {
    // Always restore button state
    setLoading(false);
  }
});
</script>
