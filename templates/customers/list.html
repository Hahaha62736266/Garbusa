<!DOCTYPE html>
<html>
<head>
  <title>Customers</title>
  <meta charset="UTF-8">
</head>
<body style="font-family:system-ui;background:#f0f4f8;padding:2rem;max-width:800px;margin:0 auto;">
  <a href="/" style="color:#2563eb;">← Home</a>
  <h1>👤 Customers</h1>
  <a href="/customers/create" style="background:#2563eb;color:white;padding:0.5rem 1rem;border-radius:6px;text-decoration:none;display:inline-block;margin-bottom:1rem;">+ New Customer</a>
  
  {% if customers and customers|length > 0 %}
    {% for c in customers %}
    <div style="background:white;padding:1rem;border-radius:6px;margin:0.5rem 0;">
      <strong>{{ c.customer_id }} — {{ c.full_name }}</strong><br>
      {{ c.contact_number }} · {{ c.address }}
    </div>
    {% endfor %}
  {% else %}
    <div style="text-align:center;padding:3rem;border:2px dashed #cbd5e1;border-radius:12px;">
      <p style="font-size:1.2rem;color:#64748b;">No customers yet</p>
      <a href="/customers/create" style="color:#2563eb;">Add your first customer</a>
    </div>
  {% endif %}
</body>
</html>
