<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaFlow — Portal Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyan: { 400: '#22d3ee', 500: '#06b6d4', 600: '#0891b2' }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #030712; }
        .glass-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">

    <div class="w-full max-w-md glass-card rounded-2xl p-8 space-y-6 relative overflow-hidden">
        
        <!-- Glow Effect -->
        <div class="absolute -right-10 -top-10 w-36 h-36 bg-cyan-500/20 rounded-full blur-2xl"></div>
        <div class="absolute -left-10 -bottom-10 w-36 h-36 bg-blue-500/20 rounded-full blur-2xl"></div>

        <!-- Header Branding -->
        <div class="text-center space-y-2 relative z-10">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-cyan-600 to-blue-500 flex items-center justify-center text-white shadow-lg shadow-cyan-500/30">
                <i class="fa-solid fa-droplet text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">AquaFlow Tracking System</h1>
            <p class="text-xs text-slate-400">Select your role or sign in with account credentials</p>
        </div>

        <!-- Role Quick-Fill Preset Buttons -->
        <div class="space-y-2 relative z-10">
            <label class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 block">Quick Demo Role Login</label>
            <div class="grid grid-cols-3 gap-2">
                <button type="button" onclick="fillCredentials('admin@aquaflow.com', 'admin123', 'admin')" class="p-2.5 rounded-xl border border-slate-800 hover:border-cyan-500/50 bg-slate-900/90 hover:bg-slate-800 transition text-left flex flex-col items-center justify-center gap-1">
                    <i class="fa-solid fa-crown text-amber-400 text-sm"></i>
                    <span class="text-[11px] font-bold text-slate-200">Admin</span>
                </button>

                <button type="button" onclick="fillCredentials('delivery@aquaflow.com', 'staff123', 'delivery')" class="p-2.5 rounded-xl border border-slate-800 hover:border-cyan-500/50 bg-slate-900/90 hover:bg-slate-800 transition text-left flex flex-col items-center justify-center gap-1">
                    <i class="fa-solid fa-truck-ramp-box text-cyan-400 text-sm"></i>
                    <span class="text-[11px] font-bold text-slate-200">Collector</span>
                </button>

                <button type="button" onclick="fillCredentials('customer@aquaflow.com', 'user123', 'customer')" class="p-2.5 rounded-xl border border-slate-800 hover:border-cyan-500/50 bg-slate-900/90 hover:bg-slate-800 transition text-left flex flex-col items-center justify-center gap-1">
                    <i class="fa-solid fa-user text-emerald-400 text-sm"></i>
                    <span class="text-[11px] font-bold text-slate-200">Customer</span>
                </button>
            </div>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4 relative z-10">
            <div id="errorBox" class="hidden p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs text-center font-medium"></div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Email Address</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-3.5 top-3 text-xs text-slate-500"></i>
                    <input type="email" id="email" required placeholder="admin@aquaflow.com" class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-9 pr-4 py-2 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-cyan-500 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Password</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3.5 top-3 text-xs text-slate-500"></i>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-9 pr-4 py-2 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-cyan-500 transition">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white text-xs py-3 rounded-xl font-bold transition shadow-lg shadow-cyan-500/25 flex items-center justify-center gap-2">
                <span>Sign In to Dashboard</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <div class="text-center pt-2 text-[11px] text-slate-500 border-t border-slate-800/80">
            © 2026 AquaFlow Environmental Systems | Security Level: TLS 1.3 Encrypted
        </div>
    </div>

    <script>
        function fillCredentials(email, password, role) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
            document.getElementById('errorBox').classList.add('hidden');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('errorBox');
            const submitBtn = document.getElementById('submitBtn');

            errorBox.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-circle-notch animate-spin"></i> Authenticating...`;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (res.ok && data.status === 200) {
                    // Save user session
                    localStorage.setItem('aqua_user', JSON.stringify(data.user));
                    submitBtn.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i> Access Granted! Redirecting...`;
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 800);
                } else {
                    errorBox.innerText = data.error || 'Invalid credentials';
                    errorBox.classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<span>Sign In to Dashboard</span> <i class="fa-solid fa-arrow-right text-xs"></i>`;
                }
            } catch (err) {
                errorBox.innerText = 'Server connection error. Please try again.';
                errorBox.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Sign In to Dashboard</span> <i class="fa-solid fa-arrow-right text-xs"></i>`;
            }
        }
    </script>
</body>
</html>
