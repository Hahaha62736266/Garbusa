<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Aquaflow Tracker{% endblock %} — Garbusa</title>
  <link rel="stylesheet" href="/static/css/screens.css">
</head>
<body>
  <nav class="navbar">
    <div class="container navbar__inner">
      <a href="/" class="navbar__brand">💧 Aquaflow Tracker</a>
      <div class="navbar__links">
        <a href="/dashboard">Dashboard</a>
        <a href="/customers">Customers</a>
        <a href="/orders">Orders</a>
        <a href="/products">Products</a>
        <a href="/collections">Collections</a>
        <button class="btn btn--sm btn--outline">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Global Loading Overlay (hidden by default) -->
  <div id="loading-overlay" style="display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.9); z-index: 200; display: none; align-items: center; justify-content: center;">
    <div class="loading-container">
      <div class="spinner"></div>
      <p>Loading data...</p>
    </div>
  </div>

  <main class="page-container">
  <main class="container">{% block content %}{% endblock %}</main>
  <footer style="text-align:center; padding:2rem; color:var(--muted); font-size:0.85rem; margin-top:3rem; border-top:1px solid var(--neutral);">
    Aquaflow Tracker · Garbusa v0.2
  </footer>
</body>
</html>
