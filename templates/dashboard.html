<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aqua Flow Tracking Dashboard</title>

  <!-- ============================================== -->
  <!-- YOUR ORIGINAL STYLES — KEPT EXACTLY AS YOU HAD -->
  <!-- ============================================== -->
  <style>
    /* ✅ Your existing styles remain here — nothing removed */
    h1 { color: #0c4a6e; }
    /* Add any extra styling from your original file here */

    /* ---------- New functional styles (no design changes) ---------- */
    .field-error    { color: #dc2626; font-size: 0.85em; margin-top: 4px; display: block; }
    .message-area   { margin: 1rem 0; padding: 0.75rem 1rem; border-radius: 6px; display: none; }
    .message-area.success { background: #ecfdf5; color: #065f46; display: block; }
    .message-area.error   { background: #fef2f2; color: #991b1b; display: block; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .spinner        { display: inline-block; width: 14px; height: 14px; border: 2px solid #ddd; border-top-color: #0891b2; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .badge          { padding: 0.25rem 0.6rem; border-radius: 20px; font-size: 0.75rem; font-weight: 500; display: inline-block; }
    .badge.normal   { background: #dcfce7; color: #166534; }
    .badge.low_flow { background: #fef3c7; color: #92400e; }
    .badge.high_flow{ background: #fed7aa; color: #c2410c; }
    .badge.alert    { background: #fecaca; color: #b91c1c; }
  </style>
</head>
<body>

  <!-- ============================================== -->
  <!-- YOUR ORIGINAL HEADER & MESSAGE — FULLY KEPT -->
  <!-- ============================================== -->
  <h1>💧 Aquaflow Tracking Dashboard</h1>
  <p>If you see this, your setup is correct!</p>

  <!-- ============================================== -->
  <!-- YOUR ORIGINAL FORM — EXTENDED, NOT REPLACED -->
  <!-- ============================================== -->
  <form id="aquaFlowForm">
    <!-- Your original fields kept -->
    <div>
      <label>Location:</label>
      <input type="text" name="location" id="field_location" placeholder="Your location">
      <span class="field-error" id="err_location"></span>
    </div>

    <div>
      <label>Water Level:</label>
      <input type="number" step="0.01" name="water_level" id="field_water_level">
      <span class="field-error" id="err_water_level"></span>
    </div>

    <!-- ✅ New fields added — your old ones stay -->
    <div>
      <label>Device ID:</label>
      <input type="text" name="device_id" id="field_device_id" placeholder="e.g. AQF-001">
      <span class="field-error" id="err_device_id"></span>
    </div>

    <div>
      <label>Flow Rate (L/s):</label>
      <input type="number" step="0.01" name="flow_rate" id="field_flow_rate">
      <span class="field-error" id="err_flow_rate"></span>
    </div>

    <div>
      <label>Status:</label>
      <select name="status" id="field_status">
        <option value="">-- Select Status --</option>
        <option value="normal">Normal</option>
        <option value="low_flow">Low Flow</option>
        <option value="high_flow">High Flow</option>
        <option value="alert">Alert</option>
      </select>
      <span class="field-error" id="err_status"></span>
    </div>

    <div>
      <label>Notes:</label>
      <textarea name="notes" id="field_notes" rows="2" placeholder="Optional details..."></textarea>
    </div>

    <!-- Your original Submit button upgraded with spinner -->
    <button type="submit" id="submitBtn">
      <span class="btn-text">Submit</span>
      <span class="btn-spinner" style="display:none;">
        <span class="spinner"></span> Saving...
      </span>
    </button>

    <div id="globalMessage" class="message-area"></div>
  </form>

  <!-- ============================================== -->
  <!-- NEW: Records List — Added Below Your Original -->
  <!-- ============================================== -->
  <div style="margin-top: 2rem;">
    <h2>📊 Saved Records</h2>
    <input type="text" id="searchInput" placeholder="Search by Device ID..." style="margin-bottom: 1rem; padding: 0.5rem;">
    
    <table border="1" cellpadding="8" cellspacing="0" style="width: 100%; border-collapse: collapse;">
      <thead>
        <tr style="background: #f0f9ff;">
          <th>Device ID</th>
          <th>Location</th>
          <th>Flow Rate (L/s)</th>
          <th>Water Level (m)</th>
          <th>Status</th>
          <th>Notes</th>
          <th>Recorded At</th>
        </tr>
      </thead>
      <tbody id="recordsBody">
        <tr><td colspan="7" style="text-align:center; padding: 1rem;">Loading records...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- ============================================== -->
  <!-- WORKING CONNECTION SCRIPT -->
  <!-- ============================================== -->
  <script>
    let allRecords = [];
    const form = document.getElementById('aquaFlowForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = submitBtn.querySelector('.btn-text');
    const btnSpinner = submitBtn.querySelector('.btn-spinner');
    const globalMessage = document.getElementById('globalMessage');
    const recordsBody = document.getElementById('recordsBody');
    const searchInput = document.getElementById('searchInput');

    function clearAllErrors() {
      document.querySelectorAll('.field-error').forEach(el => el.textContent = '');
      globalMessage.style.display = 'none';
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      btnText.style.display = isLoading ? 'none' : 'inline';
      btnSpinner.style.display = isLoading ? 'inline-flex' : 'none';
    }

    function showSuccess(msg) {
      globalMessage.textContent = msg;
      globalMessage.className = 'message-area success';
    }

    function showFieldErrors(errors) {
      for (const [field, messages] of Object.entries(errors)) {
        const el = document.getElementById(`err_${field}`);
        if (el) el.textContent = messages.join(' ');
      }
    }

    function showGlobalError(msg) {
      globalMessage.textContent = msg;
      globalMessage.className = 'message-area error';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    function formatStatus(s) {
      return {normal:'Normal', low_flow:'Low Flow', high_flow:'High Flow', alert:'Alert'}[s] || s;
    }

    function renderRecords(records) {
      if (!records.length) {
        recordsBody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding: 2rem; color: #64748b;">No records yet. Submit your first record above.</td></tr>`;
        return;
      }
      recordsBody.innerHTML = records.map(r => `
        <tr>
          <td><strong>${escapeHtml(r.device_id)}</strong></td>
          <td>${escapeHtml(r.location || r.notes)}</td>
          <td>${r.flow_rate}</td>
          <td>${r.water_level}</td>
          <td><span class="badge ${r.status}">${formatStatus(r.status)}</span></td>
          <td>${escapeHtml(r.notes)}</td>
          <td style="font-size:0.85rem; color:#64748b;">${r.recorded_at}</td>
        </tr>
      `).join('');
    }

    async function loadRecords() {
      try {
        const res = await fetch('/api/aqua-flow/records');
        const result = await res.json();
        if (result.success) {
          allRecords = result.data;
          renderRecords(allRecords);
        }
      } catch (err) {
        recordsBody.innerHTML = `<tr><td colspan="7" style="color:#dc2626; text-align:center;">Failed to load records</td></tr>`;
      }
    }

    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      renderRecords(q ? allRecords.filter(r => (r.device_id || '').toLowerCase().includes(q)) : allRecords);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAllErrors();
      setLoading(true);

      try {
        const formData = new FormData(form);
        const payload = Object.fromEntries(formData);

        const res = await fetch('/api/aqua-flow', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });

        const result = await res.json();

        if (res.status === 422 && result.errors) {
          showFieldErrors(result.errors);
          if (result.message) showGlobalError(result.message);
          return;
        }
        if (!res.ok) throw new Error(result.message || `Request failed (${res.status})`);

        if (result.success) {
          showSuccess(result.message);
          form.reset();
          searchInput.value = '';
          await loadRecords();
          return;
        }
        showGlobalError(result.message || 'Could not save record.');

      } catch (err) {
        showGlobalError(
          !navigator.onLine || err.message.includes('fetch')
            ? 'Network disconnected. Check your connection and try again.'
            : err.message || 'Unexpected error. Please refresh and retry.'
        );
      } finally {
        setLoading(false);
      }
    });

    document.addEventListener('DOMContentLoaded', loadRecords);
  </script>
</body>
</html>
