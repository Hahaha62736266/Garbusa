<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garbusa — Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #f0f4f8; padding: 2rem; max-width: 900px; margin: 0 auto; }
    h1 { color: #1e293b; margin-bottom: 2rem; }
    .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    h2 { color: #334155; margin-bottom: 1.5rem; font-size: 1.25rem; }
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #475569; }
    input, select {
      width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px;
      font-size: 1rem; transition: border-color 0.2s;
    }
    input:disabled, select:disabled { background: #f1f5f9; cursor: not-allowed; }
    .input-error { border-color: #dc2626; box-shadow: 0 0 0 2px rgba(220,38,38,0.15); }
    button {
      background: #2563eb; color: white; border: none; padding: 0.75rem 1.5rem;
      border-radius: 6px; font-size: 1rem; font-weight: 500; cursor: pointer;
      transition: background 0.2s;
    }
    button:hover:not(:disabled) { background: #1d4ed8; }
    button:disabled { opacity: 0.7; cursor: not-allowed; }

    /* Spinner */
    .spinner {
      display: inline-block; width: 14px; height: 14px; border: 2px solid transparent;
      border-top-color: currentColor; border-radius: 50%; animation: spin 0.8s linear infinite;
      margin-right: 8px; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Messages */
    .alert {
      padding: 0.875rem 1rem; border-radius: 6px; margin: 1rem 0; font-weight: 500;
    }
    .alert-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .alert-danger  { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .field-error-text { color: #dc2626; font-size: 0.85rem; margin-top: 0.3rem; display: block; }
  </style>
</head>
<body>

  <h1>Garbusa Dashboard</h1>

  <div class="card">
    <h2>💧 Acquaflow Tracking</h2>

    <form id="acquaflow-form">
      <div class="form-group">
        <label for="location">Location</label>
        <input type="text" id="location" name="location" placeholder="e.g. Cagayan de Oro — Station A">
      </div>

      <div class="form-group">
        <label for="water_level">Water Level (meters)</label>
        <input type="number" step="0.01" id="water_level" name="water_level" placeholder="e.g. 2.45">
      </div>

      <div class="form-group">
        <label for="status">Status</label>
        <select id="status" name="status">
          <option value="normal">Normal</option>
          <option value="warning">Warning</option>
          <option value="critical">Critical</option>
        </select>
      </div>

      <button type="submit" id="submit-btn">Submit Reading</button>
    </form>
  </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('acquaflow-form');
  const submitBtn = document.getElementById('submit-btn');
  const btnOriginalText = submitBtn.innerHTML;

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearAllMessages();

    // ─── 1. LOADING STATE ───
    setLoading(true);

    try {
      const formData = new FormData(form);
      const response = await fetch('/dashboard/acquaflow/submit', {
        method: 'POST',
        body: formData,
        headers: { 'Accept': 'application/json' }
      });

      const data = await response.json();

      if (!response.ok) {
        // ─── 2. ERROR HANDLING ───
        if (response.status === 422 && data.errors) {
          Object.entries(data.errors).forEach(([field, message]) => {
            const input = form.querySelector(`[name="${field}"]`);
            if (input) {
              input.classList.add('input-error');
              showFieldError(input, message);
            }
          });
          showGlobalError(data.message || "Please fix the errors below.");
        }
        else if (response.status >= 500) {
          showGlobalError("Server error. Please try again later.");
        }
        else {
          showGlobalError(data.message || "Something went wrong.");
        }
        return;
      }

      // ─── 3. SUCCESS STATE ───
      showSuccess(data.message || "Saved successfully!");
      form.reset();

    } catch (err) {
      // Network / fetch crash
      showGlobalError("Connection failed. Check your internet and try again.");
      console.error("Submit error:", err);
    } finally {
      setLoading(false);
    }
  });

  // ─── UI Helpers ───
  function setLoading(isLoading) {
    const inputs = form.querySelectorAll('input, select');
    if (isLoading) {
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spinner"></span> Processing...`;
      inputs.forEach(el => el.disabled = true);
    } else {
      submitBtn.disabled = false;
      submitBtn.innerHTML = btnOriginalText;
      inputs.forEach(el => el.disabled = false);
    }
  }

  function showSuccess(text) {
    const el = document.createElement('div');
    el.className = 'alert alert-success';
    el.textContent = text;
    form.prepend(el);
    setTimeout(() => el.remove(), 5000);
  }

  function showGlobalError(text) {
    const el = document.createElement('div');
    el.className = 'alert alert-danger';
    el.textContent = text;
    form.prepend(el);
  }

  function showFieldError(input, text) {
    const el = document.createElement('span');
    el.className = 'field-error-text';
    el.textContent = text;
    input.parentNode.appendChild(el);
  }

  function clearAllMessages() {
    form.querySelectorAll('.alert, .field-error-text').forEach(el => el.remove());
    form.querySelectorAll('.input-error').forEach(el => el.classList.remove('input-error'));
  }
});
</script>
</body>
</html>
