<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Farmer</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 0 20px; }
        form { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ddd; border-radius: 4px; }
        button { margin-top: 15px; padding: 10px 20px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Register New Farmer</h1>
    <form method="POST">
        <label>Full Name:</label>
        <input type="text" name="name" required>
        
        <label>Main Crop:</label>
        <input type="text" name="crop" required>
        
        <label>Contact Number:</label>
        <input type="text" name="contact" required>
        
        <button type="submit">Save</button>
    </form>
    <p><a href="{{ url_for('home') }}">← Back</a></p>
</body>
</html>
