<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garbusa — Farmer Support</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f4; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #2c3e50; color: white; }
        .btn { display: inline-block; padding: 8px 16px; background: #27ae60; color: white; text-decoration: none; border-radius: 4px; }
        .flash { padding: 10px; background: #d4edda; color: #155724; margin-bottom: 15px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Farmer Information System</h1>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for msg in messages %}<p class="flash">{{ msg }}</p>{% endfor %}
          {% endif %}
        {% endwith %}
        <a href="{{ url_for('add_farmer') }}" class="btn">Add New Farmer</a>
        <table>
            <tr><th>Name</th><th>Main Crop</th><th>Contact</th></tr>
            {% for f in farmers %}
            <tr><td>{{ f.name }}</td><td>{{ f.crop }}</td><td>{{ f.contact }}</td></tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
