{% extends "base.html" %}
{% set page = 'customers' %}
{% block title %}Add Customer — Aquaflow Tracker{% endblock %}

{% block content %}
  <div class="page-header">
    <h1 class="page-title">➕ Add New Customer</h1>
    <a href="/customers" class="af-btn ghost">← Back</a>
  </div>

  <div class="form-card">
    <form method="post" action="/customers">
      <div class="form-group">
        <label class="form-label" for="full_name">Full Name</label>
        <input class="form-input" type="text" id="full_name" name="full_name" placeholder="e.g. Maria Santos" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="contact_number">Contact Number</label>
        <input class="form-input" type="tel" id="contact_number" name="contact_number" placeholder="09XX-XXX-XXXX" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="address">Delivery Address</label>
        <textarea class="form-input" id="address" name="address" rows="3" placeholder="Barangay, City, Province" required></textarea>
      </div>

      <div class="form-group">
        <label class="form-label" for="initial_jugs">Initial Empty Jugs</label>
        <input class="form-input" type="number" id="initial_jugs" name="initial_jugs" value="0" min="0">
      </div>

      <div class="form-actions">
        <a href="/customers" class="af-btn ghost">Cancel</a>
        <button type="submit" class="af-btn primary">Save Customer</button>
      </div>
    </form>
  </div>
{% endblock %}
