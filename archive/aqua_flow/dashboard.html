@app.route('/dashboard')
def dashboard():
    from flask import render_template
    return render_template('aqua_flow/dashboard.html')

<style>
/* ---------- Aqua Flow Dashboard Styles ---------- */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #f0f9ff; padding: 2rem; }
.container { max-width: 1200px; margin: 0 auto; }
h1 { color: #0c4a6e; margin-bottom: 0.5rem; }
h2 { color: #0891b2; margin: 1.2rem 0; font-size: 1.1rem; }
.grid { display: grid; grid-template-columns: 380px 1fr; gap: 2rem; }
@media(max-width: 900px) { .grid { grid-template-columns: 1fr; } }

/* Form Styles */
.card { background: white; padding: 1.5rem; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.form-group { margin-bottom: 1rem; }
label { display: block; margin-bottom: 0.3rem; font-weight: 500; color: #334155; }
input, select, textarea { 
  width: 100%; padding: 0.6rem; border: 1px solid #cbd5e1; 
  border-radius: 6px; font-size: 0.95rem;
}
button { 
  padding: 0.7rem 1.5rem; background: #0891b2; color: white; border: none; 
  border-radius: 6px; cursor: pointer; font-size: 1rem; width: 100%;
}
button:hover:not(:disabled) { background: #0e7490; }
button:disabled { opacity: 0.6; cursor: not-allowed; }
.field-error { color: #dc2626; font-size: 0.85em; margin-top: 4px; display: block; }
.message-area { margin: 1rem 0; padding: 0.75rem 1rem; border-radius: 6px; display: none; }
.message-area.success { background: #ecfdf5; color: #065f46; display: block; }
.message-area.error { background: #fef2f2; color: #991b1b; display: block; }
.spinner { 
  display: inline-block; width: 14px; height: 14px; border: 2px solid #ddd; 
  border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; 
  margin-right: 6px; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Table Styles */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
th, td { padding: 0.8rem; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 0.9rem; }
th { background: #f0f9ff; color: #0c4a6e; font-weight: 600; }
tr:hover { background: #f8fafc; }

/* Status Badges */
.badge { 
  padding: 0.25rem 0.6rem; border-radius: 20px; font-size: 0.75rem; font-weight: 500; 
  display: inline-block;
}
.badge.normal { background: #dcfce7; color: #166534; }
.badge.low_flow { background: #fef3c7; color: #92400e; }
.badge.high_flow { background: #fed7aa; color: #c2410c; }
.badge.alert { background: #fecaca; color: #b91c1c; }

/* Search */
.search-bar { margin-bottom: 1rem; }
.search-bar input { max-width: 300px; }
.empty-state { text-align: center; padding: 2rem; color: #64748b; }
.loading-row { text-align: center; padding: 1.5rem; color: #64748b; }
</style>

<div class="container">
  <h1>💧 Aqua Flow Tracking System</h1>
  <p style="color:#64748b; margin-bottom:2rem;">Monitor and record water flow & device status</p>

  <div class="grid">
    <!-- ===== FORM PANEL ===== -->
    <div class="card">
      <h2>📝 Add New Record</h2>
      <form id="aquaFlowForm">
        <div class="form-group">
          <label>Device ID</label>
          <input type="text" name="device_id" id="field_device_id" placeholder="e.g. AQF-001">
          <span class="field-error" id="err_device_id"></span>
        </div>

        <div class="form-group">
          <label>Flow Rate (L/s)</label>
          <input type="number" step="0.01" name="flow_rate" id="field_flow_rate" placeholder="e.g. 12.50">
          <span class="field-error" id="err_flow_rate"></span>
        </div>

        <div class="form-group">
          <label>Water Level (m)</label>
          <input type="number" step="0.01" name="water_level" id="field_water_level" placeholder="e.g. 4.20">
          <span class="field-error" id="err_water_level"></span>
        </div>

        <div class="form-group">
          <label>Status</label>
          <select name="status" id="field_status">
            <option value="">-- Select Status --</option>
            <option value="normal">Normal</option>
            <option value="low_flow">Low Flow</option>
            <option value="high_flow">High Flow</option>
            <option value="alert">Alert</option>
          </select>
          <span class="field-error" id="err_status"></span>
        </div>

        <div class="form-group">
          <label>Notes</label>
          <textarea name="notes" id="field_notes" rows="2" placeholder="Optional details..."></textarea>
        </div>

        <button type="submit" id="submitBtn">
          <span class="btn-text">Save Record</span>
          <span class="btn-spinner" style="display:none;">
            <span class="spinner"></span> Saving...
          </span>
        </button>

        <div id="globalMessage" class="message-area"></div>
      </form>
    </div>

    <!-- ===== RECORDS / DASHBOARD PANEL ===== -->
    <div class="card">
      <h2>📊 Flow Records</h2>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search by Device ID...">
      </div>
      <div class="table-wrap">
        <table id="recordsTable">
          <thead>
            <tr>
              <th>Device</th>
              <th>Flow (L/s)</th>
              <th>Level (m)</th>
              <th>Status</th>
              <th>Time</th>
            </tr>
          </thead>
          <tbody id="recordsBody">
            <tr><td colspan="5" class="loading-row">Loading records...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
// ===== GLOBAL STATE =====
let allRecords = [];

// ===== FORM HANDLING =====
const form = document.getElementById('aquaFlowForm');
const submitBtn = document.getElementById('submitBtn');
const btnText = submitBtn.querySelector('.btn-text');
const btnSpinner = submitBtn.querySelector('.btn-spinner');
const globalMessage = document.getElementById('globalMessage');
const recordsBody = document.getElementById('recordsBody');
const searchInput = document.getElementById('searchInput');

function clearAllErrors() {
  document.querySelectorAll('.field-error').forEach(el => el.textContent = '');
  globalMessage.style.display = 'none';
}

function setLoading(isLoading) {
  submitBtn.disabled = isLoading;
  btnText.style.display = isLoading ? 'none' : 'inline';
  btnSpinner.style.display = isLoading ? 'inline-flex' : 'none';
}

function showSuccess(msg) {
  globalMessage.textContent = msg;
  globalMessage.className = 'message-area success';
}

function showFieldErrors(errors) {
  for (const [field, messages] of Object.entries(errors)) {
    const el = document.getElementById(`err_${field}`);
    if (el) el.textContent = messages.join(' ');
  }
}

function showGlobalError(msg) {
  globalMessage.textContent = msg;
  globalMessage.className = 'message-area error';
}

// ===== RENDER RECORDS =====
function renderRecords(records) {
  if (!records.length) {
    recordsBody.innerHTML = `<tr><td colspan="5" class="empty-state">No records yet. Add your first record above.</td></tr>`;
    return;
  }

  recordsBody.innerHTML = records.map(r => `
    <tr>
      <td><strong>${escapeHtml(r.device_id)}</strong></td>
      <td>${r.flow_rate}</td>
      <td>${r.water_level}</td>
      <td><span class="badge ${r.status}">${formatStatus(r.status)}</span></td>
      <td style="font-size:0.85rem; color:#64748b;">${r.recorded_at}</td>
    </tr>
  `).join('');
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function formatStatus(s) {
  return {
    normal: 'Normal',
    low_flow: 'Low Flow',
    high_flow: 'High Flow',
    alert: 'Alert'
  }[s] || s;
}

// ===== LOAD RECORDS =====
async function loadRecords() {
  try {
    const res = await fetch('/api/aqua-flow/records');
    const result = await res.json();
    
    if (result.success) {
      allRecords = result.data;
      renderRecords(allRecords);
    }
  } catch (err) {
    recordsBody.innerHTML = `<tr><td colspan="5" class="empty-state" style="color:#dc2626;">Failed to load records</td></tr>`;
  }
}

// ===== SEARCH / FILTER =====
searchInput.addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase().trim();
  if (!q) return renderRecords(allRecords);
  const filtered = allRecords.filter(r => 
    r.device_id.toLowerCase().includes(q)
  );
  renderRecords(filtered);
});

// ===== SUBMIT HANDLER =====
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearAllErrors();
  setLoading(true);

  try {
    const formData = new FormData(form);
    const payload = Object.fromEntries(formData);

    const res = await fetch('/api/aqua-flow', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    const result = await res.json();

    // 🔴 422 Validation Errors
    if (res.status === 422 && result.errors) {
      showFieldErrors(result.errors);
      if (result.message) showGlobalError(result.message);
      return;
    }

    // 🔴 Other HTTP Errors
    if (!res.ok) throw new Error(result.message || `Request failed (${res.status})`);

    // ✅ SUCCESS — Refresh list automatically
    if (result.success) {
      showSuccess(result.message);
      form.reset();
      await loadRecords(); // ← List updates instantly!
      searchInput.value = ''; // Clear search filter
      return;
    }

    showGlobalError(result.message || 'Could not save record.');

  } catch (err) {
    // 🔴 Network / 500 — Never crash UI
    console.error('Submit error:', err);
    showGlobalError(
      !navigator.onLine || err.message.includes('fetch')
        ? 'Network disconnected. Check your connection and try again.'
        : err.message || 'Unexpected error. Please refresh and retry.'
    );
  } finally {
    setLoading(false);
  }
});

// ===== INIT ON PAGE LOAD =====
document.addEventListener('DOMContentLoaded', loadRecords);
</script>
